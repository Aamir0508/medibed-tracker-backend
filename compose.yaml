services:
  medibed-tracker:
    image: medibed-tracker:local
    container_name: medibed-tracker-compose
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:mysql://host.docker.internal:3306/medibed_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata"
      DB_USER: "root"
      DB_PASSWORD: "${DB_PASSWORD}"
