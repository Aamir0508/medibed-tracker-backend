spring.application.name=medibed-tracker
server.port=8080

# ---- Database: H2 in-memory by default (zero setup). Use  --spring.profiles.active=mysql  for MySQL ----
spring.datasource.url=jdbc:h2:mem:medibed_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- MediBed settings ----
# Secret for signing JWTs: at least 32 characters. Override with the JWT_SECRET environment variable.
medibed.jwt.secret=${JWT_SECRET}
medibed.jwt.expiration-minutes=60
# First SUPER_ADMIN, created on startup if no admin exists. Override with ADMIN_PASSWORD.
medibed.admin.username=superadmin
medibed.admin.password=${ADMIN_PASSWORD}
# Load the 28 hospitals + 38 doctors from src/main/resources/seed on first start (only if the table is empty)
medibed.seed.enabled=true
# A bed category at or below this count triggers a staff notification when it drops
medibed.bed-alert-threshold=2
# Used to turn a doctor's queue length into an estimated wait
medibed.avg-consult-minutes=10
# Comma-separated list. "*" is fine for local development with the HTML frontend opened from disk.
medibed.cors.allowed-origins=*
